[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xlpro"
version = "0.0.9" # Placeholder will be auto-synced
description = "xlpro internal python module"
readme = "README.md"
license = { text = "MIT License" }
authors = [{ name = "Daniel Evans", email = "danielevans@users.noreply.github.com" }]

requires-python = ">=3.10"
dependencies = [
    "debugpy>=1.8.16",
    "filelock>=3.18.0",
    "matplotlib>=3.10.5",
    "numpy>=2.2.6",
    "pandas>=2.3.1",
    "psutil>=7.0.0",
    "pywin32>=311",
    "pillow==11.3.0",
    "tomli>=2.2.1",
]
