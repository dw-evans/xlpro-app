# xlpro application configuration file

# Note: for custom paths, ensure backslashes are not escaped. Use double backslashes '\\' or single forward slashes '/'
VSCODE_PATH = "code.exe"

XLPRO_CLI_PATH = "xlpro-cli.exe" # No need to modify
XLPRO_SERVER_PATH = "xlpro-server.exe" # No need to modify

# Set the max depth of the custom undo stack in Excel
UNDO_STACK_DEPTH = 12

# Server running configurations
LOGGING_LEVEL = "INFO"
MAX_WORKERS = 24
MULTI_SERVER_EXPERIEMENT = false